name: Graphify compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

jobs:
  supported-fixtures:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.8.14
      - name: Sync locked environment
        run: uv sync --frozen --dev
      - name: Verify every declared compatibility fixture
        run: |
          uv run pytest -q tests/test_compatibility.py tests/test_graphify_0_9_48_adapter.py tests/test_evidence.py

  upstream-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.8.14
      - name: Sync locked environment
        run: uv sync --frozen --dev
      - name: Probe newest stable upstream release
        run: |
          uv run python -m project_knowledge.compat_probe \
            --uv "$(command -v uv)" \
            --output graphify-compatibility-report.json
      - name: Upload read-only compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphify-upstream-compatibility
          path: graphify-compatibility-report.json
          retention-days: 14
