name: Graphify compatibility

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

jobs:
  supported-fixtures:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.8.14
      - name: Sync locked environment
        run: uv sync --frozen --dev
      - name: Verify every declared compatibility fixture
        run: |
          uv run pytest -q tests/test_compatibility.py tests/test_graphify_0_9_48_adapter.py tests/test_graphify_0_9_51_adapter.py tests/test_evidence.py

  upstream-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.8.14
      - name: Sync locked environment
        run: uv sync --frozen --dev
      - name: Probe newest stable upstream release
        run: |
          uv run python -m project_knowledge.compat_probe \
            --uv "$(command -v uv)" \
            --output graphify-compatibility-report.json
      - name: Upload read-only compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: graphify-upstream-compatibility
          path: graphify-compatibility-report.json
          retention-days: 14
