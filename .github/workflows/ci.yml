name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.14"
          enable-cache: false
      - name: Sync
        run: uv sync --dev --frozen
      - name: Install pinned Graphify
        run: |
          GRAPHIFY_VERSION="$(uv run python -c 'from project_knowledge.compatibility import production_graphify_compatibility as p; print(p().version)')"
          case "$GRAPHIFY_VERSION" in
            ''|*[!0-9A-Za-z._-]*) exit 1 ;;
          esac
          uv tool install "graphifyy==$GRAPHIFY_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Graphify contract
        run: uv run project-knowledge preflight --repo . --json
      - name: Focused compatibility contracts
        run: uv run pytest -q tests/test_compatibility.py tests/test_graphify_0_9_48_adapter.py tests/test_evidence.py
      - name: Focused adoption contracts
        run: |
          uv run pytest -q tests/test_real_graphify_pipeline.py tests/test_cli_adoption.py tests/test_queries.py
          uv run pytest -q tests/test_bundles_pack.py tests/test_bundles_parse.py tests/test_agent_install.py tests/test_fleet.py tests/test_workflows.py
      - name: Test
        run: uv run pytest -q
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Build
        run: uv build
