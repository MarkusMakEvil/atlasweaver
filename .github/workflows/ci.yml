name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install pinned Graphify
        run: |
          uv tool install 'graphifyy==0.9.48'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync
        run: uv sync --dev
      - name: Verify Graphify contract
        run: graphify --version | grep '0.9.48'
      - name: Test
        run: uv run pytest -q
      - name: Real Graphify lifecycle
        run: uv run pytest -q tests/test_real_graphify_pipeline.py
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Build
        run: uv build
