name: AtlasWeaver check

on:
  workflow_call:
    inputs:
      repo-root:
        type: string
        required: false
        default: "."
      python-version:
        type: string
        required: false
        default: "3.13"
      backend:
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: ""
      deep-mode:
        type: boolean
        required: false
        default: false
      require-impact-trust:
        type: boolean
        required: false
        default: false
    secrets:
      semantic_backend_token:
        required: false

permissions:
  contents: read

env:
  ATLASWEAVER_TOOL_SHA: 005cce7a0469f86392acb0b55f4bb535b5eccdd8

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout consumer snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted AtlasWeaver workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MarkusMakEvil/atlasweaver
          ref: ${{ env.ATLASWEAVER_TOOL_SHA }}
          path: atlasweaver-tool
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.14"
          enable-cache: false
      - name: Sync trusted tool
        run: uv sync --project "$GITHUB_WORKSPACE/atlasweaver-tool" --frozen
      - name: Validate extraction inputs
        env:
          ATLASWEAVER_BACKEND: ${{ inputs.backend }}
          ATLASWEAVER_MODEL: ${{ inputs.model }}
          ATLASWEAVER_DEEP: ${{ inputs.deep-mode }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_boundary validate-extraction
      - name: Install pinned Graphify
        run: |
          GRAPHIFY_VERSION="$(uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool" python -c 'from project_knowledge.compatibility import production_graphify_compatibility as p; print(p().version)')"
          case "$GRAPHIFY_VERSION" in
            ''|*[!0-9A-Za-z._-]*) exit 1 ;;
          esac
          uv tool install "graphifyy==$GRAPHIFY_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Code-only preflight
        if: ${{ inputs.backend == '' && inputs.model == '' && !inputs.deep-mode }}
        env:
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
          ATLASWEAVER_REQUIRE_IMPACT_TRUST: ${{ inputs.require-impact-trust }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_boundary check
          --consumer-checkout "$GITHUB_WORKSPACE/consumer"
          --repo-root "$ATLASWEAVER_REPO_ROOT"
          --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool"
          --output-directory "$RUNNER_TEMP/atlasweaver-check"
      - name: Semantic preflight
        if: ${{ inputs.backend != '' && inputs.model != '' }}
        env:
          ATLASWEAVER_BACKEND: ${{ inputs.backend }}
          ATLASWEAVER_BACKEND_TOKEN: ${{ secrets.semantic_backend_token }}
          ATLASWEAVER_DEEP: ${{ inputs.deep-mode }}
          ATLASWEAVER_MODEL: ${{ inputs.model }}
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
          ATLASWEAVER_REQUIRE_IMPACT_TRUST: ${{ inputs.require-impact-trust }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_boundary check
          --consumer-checkout "$GITHUB_WORKSPACE/consumer"
          --repo-root "$ATLASWEAVER_REPO_ROOT"
          --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool"
          --output-directory "$RUNNER_TEMP/atlasweaver-check"
      - name: Render content-free summary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/atlasweaver-check"
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool" python -m project_knowledge.operation_state ci-summary \
            --output-json "$RUNNER_TEMP/atlasweaver-check/atlasweaver-check-summary.json" \
            --output-markdown "$RUNNER_TEMP/atlasweaver-check/summary.md" \
            --preflight "$RUNNER_TEMP/atlasweaver-check/preflight.json" \
            --doctor "$RUNNER_TEMP/atlasweaver-check/doctor.json" \
            --scan "$RUNNER_TEMP/atlasweaver-check/scan.json" \
            --health "$RUNNER_TEMP/atlasweaver-check/health.json"
          cat "$RUNNER_TEMP/atlasweaver-check/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload content-free summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasweaver-check-summary
          path: ${{ runner.temp }}/atlasweaver-check/atlasweaver-check-summary.json
          retention-days: 7
          if-no-files-found: error
