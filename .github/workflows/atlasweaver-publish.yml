name: AtlasWeaver publish

on:
  workflow_call:
    inputs:
      repo-root:
        type: string
        required: false
        default: "."
      python-version:
        type: string
        required: false
        default: "3.13"
      backend:
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: ""
      deep-mode:
        type: boolean
        required: false
        default: false
      require-impact-trust:
        type: boolean
        required: false
        default: false
    secrets:
      semantic_backend_token:
        required: false

permissions:
  contents: read

env:
  ATLASWEAVER_TOOL_SHA: b3f45e3a40ba912b4cfeea5c64da9078325a1ab4

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project_uid: ${{ steps.inspect.outputs.project_uid }}
      channel: ${{ steps.inspect.outputs.channel }}
    steps:
      - name: Checkout consumer snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted AtlasWeaver workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MarkusMakEvil/atlasweaver
          ref: ${{ env.ATLASWEAVER_TOOL_SHA }}
          path: atlasweaver-tool
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.14"
          enable-cache: false
      - name: Sync trusted tool
        run: uv sync --project "$GITHUB_WORKSPACE/atlasweaver-tool" --frozen
      - name: Inspect publication identity
        id: inspect
        env:
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
        run: |
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool" \
            python -m project_knowledge.workflow_boundary inspect \
            --consumer-checkout "$GITHUB_WORKSPACE/consumer" \
            --repo-root "$ATLASWEAVER_REPO_ROOT" \
            --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool" \
            --output "$RUNNER_TEMP/inspect.json"

  build:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout consumer snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted AtlasWeaver workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MarkusMakEvil/atlasweaver
          ref: ${{ env.ATLASWEAVER_TOOL_SHA }}
          path: atlasweaver-tool
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.14"
          enable-cache: false
      - name: Sync trusted tool
        run: uv sync --project "$GITHUB_WORKSPACE/atlasweaver-tool" --frozen
      - name: Validate extraction inputs
        env:
          ATLASWEAVER_BACKEND: ${{ inputs.backend }}
          ATLASWEAVER_MODEL: ${{ inputs.model }}
          ATLASWEAVER_DEEP: ${{ inputs.deep-mode }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_boundary validate-extraction
      - name: Install pinned Graphify
        run: |
          GRAPHIFY_VERSION="$(uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool" python -c 'from project_knowledge.compatibility import production_graphify_compatibility as p; print(p().version)')"
          case "$GRAPHIFY_VERSION" in
            ''|*[!0-9A-Za-z._-]*) exit 1 ;;
          esac
          uv tool install "graphifyy==$GRAPHIFY_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Refresh private graph (code-only)
        if: ${{ inputs.backend == '' && inputs.model == '' && !inputs.deep-mode }}
        env:
          ATLASWEAVER_REQUIRE_IMPACT_TRUST: ${{ inputs.require-impact-trust }}
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_boundary build
          --consumer-checkout "$GITHUB_WORKSPACE/consumer"
          --repo-root "$ATLASWEAVER_REPO_ROOT"
          --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool"
          --output-bundle "$RUNNER_TEMP/build/bundle.zip"
          --output-summary "$RUNNER_TEMP/build/summary.json"
      - name: Refresh private graph
        if: ${{ inputs.backend != '' && inputs.model != '' }}
        env:
          ATLASWEAVER_BACKEND: ${{ inputs.backend }}
          ATLASWEAVER_BACKEND_TOKEN: ${{ secrets.semantic_backend_token }}
          ATLASWEAVER_DEEP: ${{ inputs.deep-mode }}
          ATLASWEAVER_MODEL: ${{ inputs.model }}
          ATLASWEAVER_REQUIRE_IMPACT_TRUST: ${{ inputs.require-impact-trust }}
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_boundary build
          --consumer-checkout "$GITHUB_WORKSPACE/consumer"
          --repo-root "$ATLASWEAVER_REPO_ROOT"
          --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool"
          --output-bundle "$RUNNER_TEMP/build/bundle.zip"
          --output-summary "$RUNNER_TEMP/build/summary.json"
      - name: Upload unprivileged build handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlasweaver-build-${{ github.run_id }}
          path: ${{ runner.temp }}/build/bundle.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [inspect, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    concurrency:
      cancel-in-progress: false
      group: atlasweaver-publish-${{ github.repository_id }}-${{ needs.inspect.outputs.project_uid }}-${{ needs.inspect.outputs.channel }}
    steps:
      - name: Checkout consumer snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout trusted AtlasWeaver workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MarkusMakEvil/atlasweaver
          ref: ${{ env.ATLASWEAVER_TOOL_SHA }}
          path: atlasweaver-tool
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.14"
          enable-cache: false
      - name: Sync trusted tool
        run: uv sync --project "$GITHUB_WORKSPACE/atlasweaver-tool" --frozen
      - name: Download unprivileged build handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlasweaver-build-${{ github.run_id }}
          path: ${{ runner.temp }}/build
      - name: Prepare verified release bundle
        env:
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
        run: |
          test -r /proc/self/fd/0
          mkdir -p "$RUNNER_TEMP/release"
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool" \
            python -m project_knowledge.workflow_publish prepare \
            --consumer-checkout "$GITHUB_WORKSPACE/consumer" \
            --repo-root "$ATLASWEAVER_REPO_ROOT" \
            --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool" \
            --input "$RUNNER_TEMP/build/bundle.zip" \
            --output "$RUNNER_TEMP/release/bundle.zip" \
            --handoff "$RUNNER_TEMP/release/publication-handoff.json"
      - name: Attest release bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ runner.temp }}/release/bundle.zip
          push-to-registry: false
      - name: Verify reusable-workflow signer
        env:
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_publish verify-attestation
          --consumer-checkout "$GITHUB_WORKSPACE/consumer"
          --repo-root "$ATLASWEAVER_REPO_ROOT"
          --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool"
          --bundle "$RUNNER_TEMP/release/bundle.zip"
          --handoff "$RUNNER_TEMP/release/publication-handoff.json"
      - name: Upload verified rolling release asset
        env:
          ATLASWEAVER_REPO_ROOT: ${{ inputs.repo-root }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/atlasweaver-tool"
          python -m project_knowledge.workflow_publish upload
          --consumer-checkout "$GITHUB_WORKSPACE/consumer"
          --repo-root "$ATLASWEAVER_REPO_ROOT"
          --trusted-tool-checkout "$GITHUB_WORKSPACE/atlasweaver-tool"
          --bundle "$RUNNER_TEMP/release/bundle.zip"
          --handoff "$RUNNER_TEMP/release/publication-handoff.json"
